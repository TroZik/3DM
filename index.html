<title>Bloc CCTA 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: plein écran 3D, barre haute fine, panneau bas coulissant (fiche / calques / liste). Thème atelier sombre assumé. */
:root{
  --bg:#14171b; --panel:#1c2026; --panel-2:#242a31; --line:#323a43;
  --fg:#e7eaed; --muted:#8d97a1; --accent:#f0a43a; --accent-ink:#1a1206;
  --renew:#e8563f; --ok:#5fb98a; --todo:#c9a227;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;}
[hidden]{display:none!important;}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font:inherit;color:inherit;}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:linear-gradient(var(--bg) 40%,transparent);pointer-events:none;z-index:5;}
.brand{display:flex;flex-direction:column;min-width:0;pointer-events:auto;}
.brand b{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.02em;line-height:1.05;}
.brand span{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.top .sp{flex:1;}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none;}
.ib svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
.ib[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);}
.ib[aria-pressed="true"] svg{stroke:var(--accent-ink);}

.tools{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:4;}
.explode{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:4;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:10px;}
.explode label{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}
.explode input{width:min(36vw,170px);accent-color:var(--accent);}

.hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet-h,64px) + 14px);z-index:3;
  background:rgba(28,32,38,.92);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:12.5px;color:var(--muted);white-space:nowrap;transition:opacity .3s;}

.seqbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  top:calc(118px + env(safe-area-inset-top,0px));z-index:6;background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.seqbar .row{display:flex;align-items:center;gap:10px;}
.seqbar b{font-family:var(--f-display);font-size:16px;flex:1;min-width:0;}
.seqbar .stage{font-family:var(--f-mono);font-size:13px;color:var(--accent);}
.seqbar .steps{display:flex;flex-wrap:wrap;gap:6px;}
.seqbar .steps span{font-family:var(--f-mono);font-size:11.5px;padding:3px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted);}
.seqbar .steps span.on{background:var(--accent);color:var(--accent-ink);}
.btn{border:1px solid var(--line);background:var(--panel-2);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap;}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}

/* Panneau bas */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  max-height:min(62vh,560px);display:flex;flex-direction:column;transition:transform .28s ease;padding-bottom:env(safe-area-inset-bottom,0px);
  box-shadow:0 -10px 30px rgba(0,0,0,.35);}
.sheet.collapsed .body{display:none;}
.handle{display:flex;justify-content:center;padding:8px 0 2px;cursor:pointer;}
.handle i{width:38px;height:4px;border-radius:2px;background:var(--line);}
.tabs{display:flex;gap:6px;padding-block:4px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
.tab{flex:1;border:1px solid var(--line);background:transparent;border-radius:9px;padding:8px 6px;font-family:var(--f-display);font-weight:600;font-size:14.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--fg);border-color:var(--muted);}
.body{overflow-y:auto;overscroll-behavior:contain;padding-block:0 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}

.empty{color:var(--muted);font-size:14px;line-height:1.5;padding:4px 0 8px;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--muted);}
.legend span{display:flex;align-items:center;gap:6px;}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block;}

.card h2{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;margin:2px 0 2px;text-wrap:balance;}
.card .en{color:var(--muted);font-size:12.5px;margin-bottom:10px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
.chip.renew{border-color:var(--renew);color:var(--renew);}
.chip.ok{border-color:var(--ok);color:var(--ok);}
.chip.todo{border-color:var(--todo);color:var(--todo);}
.chip.acc{border-color:var(--accent);color:var(--accent);}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin:0 0 12px;font-size:14px;}
dl.kv dt{color:var(--muted);}
dl.kv dd{margin:0;min-width:0;}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
.torque{font-family:var(--f-mono);font-weight:700;font-size:24px;color:var(--accent);line-height:1.1;}
.stages{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:5px;counter-reset:st;}
.stages li{display:flex;gap:10px;align-items:baseline;font-size:14px;}
.stages li::before{counter-increment:st;content:counter(st);font-family:var(--f-mono);font-size:12px;width:20px;height:20px;flex:none;border-radius:5px;background:var(--panel-2);display:grid;place-items:center;color:var(--accent);}
.note{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 10px;}
.sec{font-family:var(--f-display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
.bg-list{display:flex;flex-direction:column;gap:8px;}
.bg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--panel-2);cursor:pointer;text-align:left;}
.bg .t{font-weight:600;font-size:14px;min-width:0;}
.bg .s{font-size:12.5px;color:var(--muted);grid-column:1;min-width:0;}
.bg .v{font-family:var(--f-mono);font-size:13px;color:var(--accent);grid-row:1 / span 2;grid-column:2;text-align:right;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px;}
a.src{color:var(--accent);font-size:13px;word-break:break-word;}

.layers{display:flex;flex-direction:column;gap:2px;}
.lay{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;}
.lay:last-child{border-bottom:0;}
.lay .sw{width:14px;height:14px;border-radius:4px;flex:none;}
.lay .n{flex:1;font-size:15px;}
.lay .c{font-size:12px;color:var(--muted);font-family:var(--f-mono);}
.tg{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .2s;}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--fg);transition:transform .2s;}
.lay[aria-checked="true"] .tg{background:var(--accent);}
.lay[aria-checked="true"] .tg::after{transform:translateX(18px);background:var(--accent-ink);}

.search{width:100%;box-sizing:border-box;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font:inherit;font-size:15px;margin-bottom:10px;}
.list{display:flex;flex-direction:column;}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;}
.li .sw{width:10px;height:10px;border-radius:3px;}
.li .t{font-size:14.5px;min-width:0;}
.li .t small{display:block;color:var(--muted);font-size:12px;}
.li .v{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);}
.disclaimer{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px;border-top:1px solid var(--line);padding-top:10px;}
@media (prefers-reduced-motion:reduce){.sheet,.hint,.tg,.tg::after{transition:none;}}
</style>

<div id="app">
  <canvas id="c" aria-label="Vue 3D du bloc moteur"></canvas>

  <header class="top">
    <div class="brand"><b>EA888 · CCTA</b><span>Audi A3 8PA 2012 · DQ250 Quattro · bloc et visserie</span></div>
    <div class="sp"></div>
    <button class="ib" id="btnReset" title="Recentrer la vue" aria-label="Recentrer la vue"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  </header>

  <div class="explode"><label for="ex">Éclaté</label><input id="ex" type="range" min="0" max="100" value="0"></div>

  <div class="tools">
    <button class="ib" id="btnXray" aria-pressed="false" title="Transparence du bloc" aria-label="Transparence du bloc"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M4 14l6-6M9 20l11-11M15 20l5-5"/></svg></button>
    <button class="ib" id="btnGhost" aria-pressed="true" title="Accessoires en silhouette" aria-label="Accessoires en silhouette"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" stroke-dasharray="3 3"/><circle cx="12" cy="12" r="2"/></svg></button>
    <button class="ib" id="btnBolts" aria-pressed="true" title="Afficher la visserie" aria-label="Afficher la visserie"><svg viewBox="0 0 24 24"><path d="M8 3h8l3 5-3 5H8L5 8z"/><path d="M12 13v8"/></svg></button>
  </div>

  <div class="hint" id="hint">Touchez une pièce ou une vis</div>

  <div class="seqbar" id="seqbar" hidden>
    <div class="row"><b id="seqTitle">Ordre de serrage</b><span class="stage mono" id="seqNow"></span></div>
    <div class="steps" id="seqSteps"></div>
    <div class="row"><button class="btn" id="seqReplay">Rejouer</button><button class="btn" id="seqLoosen" hidden>Ordre de desserrage</button><span style="flex:1"></span><button class="btn pri" id="seqClose">Terminer</button></div>
  </div>

  <section class="sheet" id="sheet">
    <div class="handle" id="handle" aria-label="Agrandir ou réduire le panneau"><i></i></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tFiche" aria-selected="true">Fiche</button>
      <button class="tab" role="tab" id="tCalques" aria-selected="false">Calques</button>
      <button class="tab" role="tab" id="tListe" aria-selected="false">Liste</button>
    </div>
    <div class="body" id="body"></div>
  </section>
</div>

function rboxGeo(x0,x1,y0,y1,z0,z1,r){
  const w=x1-x0,h=y1-y0,d=z1-z0; r=Math.max(.5,Math.min(r,w/2-.5,h/2-.5,d/2-.5));
  const s=new THREE.Shape(), hw=w/2-r, hh=h/2-r;
  s.moveTo(-hw,-hh-r); s.lineTo(hw,-hh-r); s.quadraticCurveTo(hw+r,-hh-r,hw+r,-hh); s.lineTo(hw+r,hh); s.quadraticCurveTo(hw+r,hh+r,hw,hh+r);
  s.lineTo(-hw,hh+r); s.quadraticCurveTo(-hw-r,hh+r,-hw-r,hh); s.lineTo(-hw-r,-hh); s.quadraticCurveTo(-hw-r,-hh-r,-hw,-hh-r);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(.1,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:0.001,bevelSegments:3,curveSegments:4});
  g.translate(0,0,-(d-2*r)/2); g.translate((x0+x1)/2,(y0+y1)/2,(z0+z1)/2); return g;
}
function cylGeo(ax,cx,cy,cz,r,len){
  const g=new THREE.CylinderGeometry(r,r,len,40,1);
  if(ax==="x") g.rotateZ(Math.PI/2); if(ax==="z") g.rotateX(Math.PI/2);
  g.translate(cx,cy,cz); return g;
}

const R={"M5":4,"M6":5,"M8":6.5,"M10":8,"M12":9.5,"M14":10.5,"M18x1,5":13,"M10/M12":9,"—":9};
const MAT_REUSE=new THREE.MeshStandardMaterial({color:"#c3cad1",roughness:.35,metalness:.85});
const MAT_RENEW=new THREE.MeshStandardMaterial({color:"#e8563f",roughness:.4,metalness:.5});
const MAT_TODO =new THREE.MeshStandardMaterial({color:"#c9a227",roughness:.4,metalness:.5});
const MAT_HIT=new THREE.MeshBasicMaterial({transparent:true,opacity:0,depthWrite:false,colorWrite:false});
const MAT_HL=new THREE.MeshStandardMaterial({color:"#f0a43a",emissive:"#f0a43a",emissiveIntensity:.55,roughness:.4,metalness:.3});
const MAT_DONE=new THREE.MeshStandardMaterial({color:"#5fb98a",emissive:"#2f7a52",emissiveIntensity:.5,roughness:.4,metalness:.3});
const boltAll=[];
const up=new THREE.Vector3(0,1,0);
BOLTS.forEach(b=>{
  const part=PARTS.find(p=>p.id===b.part); b.partRef=part; b.meshes=[];
  const r=R[b.m]||6.5, baseMat=b.todo?MAT_TODO:(b.renew?MAT_RENEW:MAT_REUSE);
  b.pts.forEach((pt,i)=>{
    const dir=new THREE.Vector3(...b.dir); if(pt[4]===1||pt[4]===-1){ if(b.id==="mbs") dir.set(0,0,pt[4]); }
    const g=new THREE.Group();
    const head=new THREE.Mesh(new THREE.CylinderGeometry(r*1.15,r*1.15,r*.75,6),baseMat); head.position.y=r*.375;
    const wash=new THREE.Mesh(new THREE.CylinderGeometry(r*1.55,r*1.55,r*.18,20),MAT_REUSE); wash.position.y=r*.09;
    const hit=new THREE.Mesh(new THREE.SphereGeometry(Math.max(13,r*2.1),8,6),MAT_HIT); hit.position.y=r*.5;
    [head,wash,hit].forEach(m=>{m.userData={kind:"bolt",gid:b.id,idx:i};});
    g.add(wash,head,hit);
    g.quaternion.setFromUnitVectors(up,dir.clone().normalize());
    g.position.set(pt[0],pt[1],pt[2]);
    g.userData={kind:"bolt",gid:b.id,idx:i,home:new THREE.Vector3(pt[0],pt[1],pt[2]),dir:dir.clone().normalize(),head,baseMat};
    pickables.push(hit);
    part.obj.add(g); b.meshes.push(g); boltAll.push(g);
  });
});

function labelSprite(txt){
  const c=document.createElement("canvas"); c.width=c.height=128; const x=c.getContext("2d");
  x.fillStyle="#f0a43a"; x.beginPath(); x.arc(64,64,54,0,Math.PI*2); x.fill();
  x.lineWidth=8; x.strokeStyle="#1a1206"; x.stroke();
  x.fillStyle="#1a1206"; x.font="700 64px JetBrains Mono, monospace"; x.textAlign="center"; x.textBaseline="middle"; x.fillText(String(txt),64,68);
  const t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true})); s.scale.set(30,30,1); s.renderOrder=10; return s;
}

const state={sel:null, explode:0, xray:false, ghost:true, bolts:true, layers:Object.fromEntries(LAYERS.map(l=>[l.id,true])), seq:null, tab:"fiche"};

function applyExplode(){
  const e=state.explode;
  PARTS.forEach(p=>{p.obj.position.set(p.ex[0]*e,p.ex[1]*e,p.ex[2]*e);});
  boltAll.forEach(g=>{const u=g.userData; g.position.copy(u.home).addScaledVector(u.dir,70*e);});
}
function applyVisibility(){
  LAYERS.forEach(L=>{layerGroups[L.id].visible = state.layers[L.id] && (L.id!=="acc"||state.ghost);});
  boltAll.forEach(g=>{
    const b=BOLTS.find(x=>x.id===g.userData.gid);
    let v=state.bolts; if(b.internal && !state.xray && !(state.seq&&state.seq.b===b)) v=false;
    g.visible=v;
  });
  // les vis des accessoires restent visibles même si la silhouette est masquée
  ["alt","acomp","intake","turbo","starter","dsg","tens"].forEach(id=>{
    const o=partObj[id]; o.children.forEach(ch=>{ if(ch.userData.kind!=="bolt") ch.visible = state.ghost && state.layers.acc; });
  });
  layerGroups.acc.visible = state.layers.acc;
}
function applyMaterials(){
  const selPart = state.sel && state.sel.kind==="part" ? state.sel.id : (state.sel&&state.sel.kind==="bolt" ? null : null);
  const dimAll = !!state.seq;
  PARTS.forEach(p=>{
    const m=p.obj.userData.mat, base=p.obj.userData.base;
    m.emissive && m.emissive.set(0x000000);
    if(p.ghost){ m.opacity = dimAll?.07:base.op; m.color.copy(base.col); }
    else {
      const x = state.xray && ["block","sumpU","sumpL","head","camh","tcl","tcu"].includes(p.id);
      const dim = dimAll && !(state.seq && state.seq.b.part===p.id);
      m.transparent = x||dim; m.opacity = x?.22:(dim?.35:1); m.depthWrite = !(x||dim);
      m.color.copy(base.col);
    }
    if(selPart===p.id){ m.emissive.set("#5a3a08"); }
    m.needsUpdate=true;
  });
  boltAll.forEach(g=>{const u=g.userData; u.head.material=u.baseMat;});
  if(state.sel && state.sel.kind==="bolt"){
    const b=BOLTS.find(x=>x.id===state.sel.gid); b.meshes.forEach((g,i)=>{ g.userData.head.material = (i===state.sel.idx)?MAT_HL:g.userData.baseMat; });
  }
}

function resize(){

  camera.setViewOffset(w,h,0,(document.getElementById("sheet").offsetHeight)*0.35,w,h);
}
let tween=null;
function flyTo(target,dist,dirv){
  const t0=performance.now(), p0=camera.position.clone(), q0=controls.target.clone();
  const d = dirv ? dirv.clone().normalize() : camera.position.clone().sub(controls.target).normalize();
  const p1=target.clone().addScaledVector(d,dist);
  tween={t0,p0,q0,p1,q1:target.clone(),dur:650};
}
const fit=d=>d/Math.min(1,camera.aspect*1.25);

function centerOf(obj){ const b=new THREE.Box3().setFromObject(obj); const c=new THREE.Vector3(); b.getCenter(c); const s=new THREE.Vector3(); b.getSize(s); return {c,r:Math.max(s.x,s.y,s.z)}; }

/* ============================================================ Sélection */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let down=null;
canvas.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
canvas.addEventListener("pointerup",e=>{
  if(!down) return; const dx=e.clientX-down.x, dy=e.clientY-down.y; const quick=performance.now()-down.t<450; down=null;
  if(dx*dx+dy*dy>64||!quick) return;
  const r=canvas.getBoundingClientRect();
  ndc.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const vis=pickables.filter(isShown);
  const hits=ray.intersectObjects(vis,false);
  if(!hits.length){ select(null); return; }
  // priorité aux vis proches du premier impact
  let h=hits[0]; const bh=hits.find(x=>x.object.userData.kind==="bolt" && x.distance<h.distance+40); if(bh) h=bh;
  const ud=h.object.userData;
  if(ud.kind==="bolt") select({kind:"bolt",gid:ud.gid,idx:ud.idx}); else select({kind:"part",id:ud.id});
});
function isShown(o){
  let n=o; while(n){ if(!n.visible) return false; n=n.parent; }
  if(o.userData.kind==="part"){ const p=PARTS.find(x=>x.id===o.userData.id); if(p.ghost && !state.ghost) return false; }
  return true;
}
function select(s,focus){
  if(state.seq) stopSeq();
  state.sel=s; applyMaterials(); setTab("fiche"); renderSheet(); expandSheet(!!s);
  document.getElementById("hint").style.opacity = s?0:1;
  if(s && focus){
    if(s.kind==="part"){ const {c,r}=centerOf(partObj[s.id]); flyTo(c,fit(Math.max(450,r*2.2))); }
    else { const b=BOLTS.find(x=>x.id===s.gid); const g=b.meshes[s.idx]; const c=new THREE.Vector3(); g.getWorldPosition(c); flyTo(c,fit(620),g.userData.dir.clone().add(new THREE.Vector3(0,.5,0))); }
  }
}

/* ============================================================ Ordre de serrage animé */
let seqTimer=null;
function startSeq(gid,loosen){
  const b=BOLTS.find(x=>x.id===gid); stopSeq(true);
  state.seq={b,loosen:!!loosen,labels:[]};
  applyVisibility(); applyMaterials();
  const key = loosen?4:3;
  const nums=[...new Set(b.pts.map(p=>p[key]))].sort((a,c)=>a-c);
  b.meshes.forEach((g,i)=>{ const s=labelSprite(b.pts[i][key]); s.position.set(0,30,0); g.add(s); s.visible=false; state.seq.labels.push(s); g.userData.head.material=g.userData.baseMat; });
  const grpC=new THREE.Vector3(); b.meshes.forEach(g=>{const v=new THREE.Vector3(); g.getWorldPosition(v); grpC.add(v);}); grpC.multiplyScalar(1/b.meshes.length);
  const span=new THREE.Box3(); b.meshes.forEach(g=>{const v=new THREE.Vector3(); g.getWorldPosition(v); span.expandByPoint(v);}); const sz=new THREE.Vector3(); span.getSize(sz);
  flyTo(grpC,fit(Math.max(560,Math.max(sz.x,sz.y,sz.z)*2.3)),new THREE.Vector3(...b.dir).add(new THREE.Vector3(0.15,0.25,0.15)));
  const bar=document.getElementById("seqbar"); bar.hidden=false;
  document.getElementById("seqTitle").textContent=(loosen?"Desserrage · ":"Serrage · ")+b.name;
  document.getElementById("seqLoosen").hidden = !b.loosen || loosen;
  const steps=document.getElementById("seqSteps"); steps.innerHTML="";
  (loosen?["Desserrer dans l'ordre"]:b.st).forEach((t,i)=>{const s=document.createElement("span"); s.textContent=(i+1)+". "+t; steps.appendChild(s);});
  expandSheet(false);
  let k=0;
  const now=document.getElementById("seqNow");
  const tick=()=>{
    if(!state.seq) return;
    if(k>0){ const prev=nums[k-1]; b.meshes.forEach((g,i)=>{ if(b.pts[i][key]===prev) g.userData.head.material=MAT_DONE; }); }
    if(k>=nums.length){ now.textContent="Terminé"; [...steps.children].forEach(s=>s.classList.add("on")); return; }
    const n=nums[k]; now.textContent="Vis "+n+" / "+nums[nums.length-1];
    b.meshes.forEach((g,i)=>{ if(b.pts[i][key]===n){ g.userData.head.material=MAT_HL; state.seq.labels[i].visible=true; } });
    if(k===0 && steps.children[0]) steps.children[0].classList.add("on");
    k++; seqTimer=setTimeout(tick,850);
  };
  seqTimer=setTimeout(tick,700);
}
function stopSeq(keep){
  clearTimeout(seqTimer);
  if(state.seq){ state.seq.labels.forEach(s=>{s.parent&&s.parent.remove(s); s.material.map.dispose(); s.material.dispose();}); }
  state.seq=null; document.getElementById("seqbar").hidden=true;
  if(!keep){ applyVisibility(); applyMaterials(); }
}
document.getElementById("seqClose").onclick=()=>{stopSeq(); expandSheet(true);};
document.getElementById("seqReplay").onclick=()=>{ if(state.seq){const s=state.seq; startSeq(s.b.id,s.loosen);} };
document.getElementById("seqLoosen").onclick=()=>{ if(state.seq) startSeq(state.seq.b.id,true); };

const body=document.getElementById("body"), sheet=document.getElementById("sheet");
function expandSheet(open){ sheet.classList.toggle("collapsed",!open); requestAnimationFrame(updSheetH); }
function updSheetH(){ document.documentElement.style.setProperty("--sheet-h",sheet.offsetHeight+"px"); resize(); }
document.getElementById("handle").onclick=()=>expandSheet(sheet.classList.contains("collapsed"));
function setTab(t){ state.tab=t; ["fiche","calques","liste"].forEach(x=>document.getElementById("t"+x[0].toUpperCase()+x.slice(1)).setAttribute("aria-selected",String(x===t))); }
document.getElementById("tFiche").onclick=()=>{setTab("fiche");renderSheet();expandSheet(true);};
document.getElementById("tCalques").onclick=()=>{setTab("calques");renderSheet();expandSheet(true);};
document.getElementById("tListe").onclick=()=>{setTab("liste");renderSheet();expandSheet(true);};

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const layerOf=id=>LAYERS.find(l=>l.id===id);
function chipsFor(b){
  let h=""; if(b.todo) h+='<span class="chip todo">Couple à compléter</span>';
  h+= b.renew?'<span class="chip renew">À remplacer</span>':'<span class="chip ok">Réutilisable</span>';
  if(b.seq!==false && b.pts.some(p=>p[3])) h+='<span class="chip acc">Ordre de serrage</span>';
  return h;
}
function renderSheet(){
  if(state.tab==="calques") return renderLayers();
  if(state.tab==="liste") return renderList();
  const s=state.sel;
  if(!s){
    body.innerHTML=`<p class="empty">Touchez une pièce ou une vis pour voir sa fiche : référence, couple, angle, remplacement et ordre de serrage animé.<br>Un doigt pour tourner, deux doigts pour zoomer et déplacer.</p>
    <div class="legend"><span><i class="dot" style="background:#e8563f"></i>Vis à remplacer</span><span><i class="dot" style="background:#c3cad1"></i>Vis réutilisable</span><span><i class="dot" style="background:#c9a227"></i>Couple à compléter</span><span><i class="dot" style="background:#6fa8dc;opacity:.6"></i>Accessoire (silhouette)</span></div>
    <p class="disclaimer">Couples, angles et ordres : manuel atelier VW moteur 1.8/2.0 TFSI chaîne (éd. 08.2018), valeurs CCTA. Formes et positions des pièces : schématiques. Références pièces : à compléter (catalogue ETKA).</p>`;
    return;
  }
  if(s.kind==="part"){
    const p=PARTS.find(x=>x.id===s.id), L=layerOf(p.layer);
    const groups=BOLTS.filter(b=>b.part===p.id);
    body.innerHTML=`<div class="card">
      <h2>${esc(p.name)}</h2><div class="en">${esc(p.en)}</div>
      <div class="chips"><span class="chip" style="border-color:${L.color};color:${L.color}">${esc(L.name)}</span>${p.ghost?'<span class="chip">Silhouette</span>':''}${p.renew?'<span class="chip renew">À remplacer</span>':''}</div>
      <dl class="kv"><dt>Référence</dt><dd class="mono">à compléter</dd><dt>Vis</dt><dd>${groups.reduce((a,b)=>a+b.pts.length,0)} en ${groups.length} groupe${groups.length>1?"s":""}</dd></dl>
      <p class="note">${esc(p.info||"")}</p>
      <div class="actions"><button class="btn" id="aFocus">Centrer</button><button class="btn" id="aIso">${isoId===p.id?"Tout afficher":"Isoler"}</button></div>
      ${groups.length?'<div class="sec">Visserie</div><div class="bg-list">'+groups.map(b=>`<button class="bg" data-g="${b.id}"><span class="t">${esc(b.name)}</span><span class="s">${b.pts.length} × ${esc(b.m)} · ${b.renew?"à remplacer":"réutilisable"}${(b.seq!==false&&b.pts.some(q=>q[3]))?" · ordre":""}</span><span class="v">${esc(b.torque)}</span></button>`).join("")+'</div>':''}
      <p class="disclaimer"><a class="src" href="${p.src}" target="_blank" rel="noopener">Source : manuel atelier (page de la pièce)</a></p></div>`;
    body.querySelectorAll(".bg").forEach(el=>el.onclick=()=>{select({kind:"bolt",gid:el.dataset.g,idx:0},true);});
    document.getElementById("aFocus").onclick=()=>{const {c,r}=centerOf(partObj[p.id]); flyTo(c,fit(Math.max(450,r*2.2)));};
    document.getElementById("aIso").onclick=()=>{isolate(isoId===p.id?null:p.id); renderSheet();};
  } else {
    const b=BOLTS.find(x=>x.id===s.gid), pt=b.pts[s.idx], p=b.partRef;
    const hasSeq = b.seq!==false && b.pts.some(q=>q[3]);
    body.innerHTML=`<div class="card">
      <h2>${esc(b.name)}</h2><div class="en">${esc(b.en)} · sur ${esc(p.name.toLowerCase())}</div>
      <div class="chips">${chipsFor(b)}</div>
      <div class="torque">${esc(b.torque)}</div>
      <dl class="kv" style="margin-top:10px"><dt>Référence</dt><dd class="mono">à compléter</dd><dt>Filetage</dt><dd class="mono">${esc(b.m)}</dd><dt>Quantité</dt><dd class="mono">${b.pts.length}</dd>${hasSeq?`<dt>Position</dt><dd class="mono">n° ${pt[3]} dans l'ordre</dd>`:''}</dl>
      <div class="sec">Procédure</div><ol class="stages">${b.st.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
      ${b.note?`<p class="note">${esc(b.note)}</p>`:''}${b.loosen?`<p class="note">${esc(b.loosen)}</p>`:''}
      <div class="actions">${hasSeq?'<button class="btn pri" id="aSeq">▶ Ordre de serrage</button>':''}${b.loosen?'<button class="btn" id="aLoos">Ordre de desserrage</button>':''}<button class="btn" id="aPart">Voir la pièce</button></div>
      <p class="disclaimer"><a class="src" href="${b.src}" target="_blank" rel="noopener">Source : manuel atelier</a>${b.todo?" · valeur absente du manuel moteur":""}</p></div>`;
    if(hasSeq) document.getElementById("aSeq").onclick=()=>startSeq(b.id);
    if(b.loosen) document.getElementById("aLoos").onclick=()=>startSeq(b.id,true);
    document.getElementById("aPart").onclick=()=>select({kind:"part",id:p.id},true);
  }
}
function renderLayers(){
  const count=id=>PARTS.filter(p=>p.layer===id).length;
  body.innerHTML='<div class="layers">'+LAYERS.map(L=>`<div class="lay" role="switch" tabindex="0" aria-checked="${state.layers[L.id]}" data-l="${L.id}"><i class="sw" style="background:${L.color}"></i><span class="n">${esc(L.name)}</span><span class="c">${count(L.id)}</span><i class="tg"></i></div>`).join("")+'</div>'+
    '<div class="actions" style="margin-top:12px"><button class="btn" id="lAll">Tout afficher</button><button class="btn" id="lBlock">Bloc nu</button></div>';
  body.querySelectorAll(".lay").forEach(el=>{const f=()=>{state.layers[el.dataset.l]=!state.layers[el.dataset.l]; applyVisibility(); renderLayers();}; el.onclick=f; el.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();f();}};});
  document.getElementById("lAll").onclick=()=>{isolate(null); LAYERS.forEach(L=>state.layers[L.id]=true); applyVisibility(); renderLayers();};
  document.getElementById("lBlock").onclick=()=>{LAYERS.forEach(L=>state.layers[L.id]=(L.id==="struct")); applyVisibility(); renderLayers();};
}
let listQ="";
function renderList(){
  body.innerHTML=`<input class="search" id="q" type="search" placeholder="Rechercher : culasse, carter, 9 Nm…" value="${esc(listQ)}" aria-label="Rechercher une pièce ou une vis"><div class="list" id="lst"></div>`;
  const q=document.getElementById("q"); q.oninput=()=>{listQ=q.value; fill();};
  function fill(){
    const t=listQ.trim().toLowerCase(); const lst=document.getElementById("lst"); let h="";
    LAYERS.forEach(L=>{
      PARTS.filter(p=>p.layer===L.id).forEach(p=>{
        const gs=BOLTS.filter(b=>b.part===p.id);
        const pm=!t||(p.name+" "+p.en).toLowerCase().includes(t);
        const gm=gs.filter(b=>!t||(b.name+" "+b.en+" "+b.torque).toLowerCase().includes(t));
        if(!pm && !gm.length) return;
        h+=`<button class="li" data-p="${p.id}"><i class="sw" style="background:${L.color}"></i><span class="t">${esc(p.name)}<small>${esc(L.name)}</small></span><span class="v">${gs.reduce((a,b)=>a+b.pts.length,0)} vis</span></button>`;
        gm.forEach(b=>{h+=`<button class="li" data-g="${b.id}" style="padding-left:22px"><i class="sw" style="background:${b.todo?'#c9a227':(b.renew?'#e8563f':'#c3cad1')}"></i><span class="t">${esc(b.name)}<small>${b.pts.length} × ${esc(b.m)}</small></span><span class="v">${esc(b.torque)}</span></button>`;});
      });
    });
    lst.innerHTML=h||'<p class="empty">Aucun résultat.</p>';
    lst.querySelectorAll(".li").forEach(el=>el.onclick=()=>{
      if(el.dataset.p){ ensureVisible(el.dataset.p); select({kind:"part",id:el.dataset.p},true); }
      else { const b=BOLTS.find(x=>x.id===el.dataset.g); ensureVisible(b.part); select({kind:"bolt",gid:b.id,idx:0},true); }
    });
  }
  fill();
}
function ensureVisible(pid){ const p=PARTS.find(x=>x.id===pid); if(!state.layers[p.layer]){state.layers[p.layer]=true;} if(p.ghost&&!state.ghost){state.ghost=true;btnSet("btnGhost",true);} if(isoId&&isoId!==pid) isolate(null); applyVisibility(); }

let isoId=null;
function isolate(pid){
  isoId=pid;
  PARTS.forEach(p=>{ p.obj.visible = !pid || p.id===pid; });
  if(pid){ const {c,r}=centerOf(partObj[pid]); flyTo(c,fit(Math.max(450,r*2.2))); }
}

/* ============================================================ Boutons */
function btnSet(id,v){document.getElementById(id).setAttribute("aria-pressed",String(v));}
document.getElementById("btnXray").onclick=()=>{state.xray=!state.xray; btnSet("btnXray",state.xray); applyVisibility(); applyMaterials();};
document.getElementById("btnGhost").onclick=()=>{state.ghost=!state.ghost; btnSet("btnGhost",state.ghost); applyVisibility(); applyMaterials();};
document.getElementById("btnBolts").onclick=()=>{state.bolts=!state.bolts; btnSet("btnBolts",state.bolts); applyVisibility();};
document.getElementById("btnReset").onclick=()=>{ if(state.seq) stopSeq(); isolate(null); homeView(); };
document.getElementById("ex").oninput=e=>{state.explode=e.target.value/100; applyExplode();};

/* ============================================================ Boucle */
function loop(t){
  requestAnimationFrame(loop);
  if(tween){ const k=Math.min(1,(t-tween.t0)/tween.dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e); controls.target.lerpVectors(tween.q0,tween.q1,e); if(k>=1) tween=null; }
  controls.update(); renderer.render(scene,camera);
}
window.addEventListener("resize",resize);
applyExplode(); applyVisibility(); applyMaterials(); renderSheet(); expandSheet(true);
requestAnimationFrame(()=>{updSheetH(); homeView();});
requestAnimationFrame(loop);
</script>
